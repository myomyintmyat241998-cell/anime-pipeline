name: Anime Automation Pipeline

on:
  workflow_dispatch: # cron-job.org မှ API ဖြင့် လှမ်းခေါ်ရန် (သို့) GitHub UI မှ Manual နှိပ်ရန်

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Repo ထဲသို့ ဖိုင်အော်တို Commit/Push တင်ခွင့်ပြုရန်
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install feedparser requests

      - name: Run Main Automation Script
        env:
          VK_ACCESS_TOKEN: ${{ secrets.VK_ACCESS_TOKEN }}
          VK_GROUP_ID: ${{ secrets.VK_GROUP_ID }}
        run: |
          python main.py

